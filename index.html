<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="在浏览器本地分析 Amazon ABA 热门搜索词 CSV" />
  <meta name="theme-color" content="#315c56" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Amazon ABA 热门搜索词分析器</title>
  <style>
    :root { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; color: #17233b; background: #f4f6fa; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 760px; }
    button, input, select { font: inherit; }
    .shell { width: min(1760px, 100%); margin: 0 auto; padding: 18px 26px 24px; }
    .topbar { display: flex; align-items: center; gap: 12px; min-height: 46px; }
    .logo { display: grid; place-items: center; width: 38px; height: 38px; flex: 0 0 auto; border-radius: 11px; color: #fff; background: linear-gradient(135deg, #3178f6, #6e58e8); font-size: 11px; font-weight: 800; letter-spacing: .5px; }
    h1 { margin: 0; color: #17233b; font-size: 21px; letter-spacing: -.25px; }
    .local-badge { margin-left: auto; padding: 5px 9px; border-radius: 20px; color: #39735f; background: #e7f6ef; font-size: 11px; font-weight: 700; }
    .upload-panel { margin-top: 16px; min-height: 138px; display: grid; place-content: center; text-align: center; border: 1.5px dashed #b9cdf1; border-radius: 14px; background: #fff; box-shadow: 0 5px 18px #23386408; }
    .upload-panel.dragging { border-color: #3178f6; background: #eef5ff; }
    .upload-panel h2 { margin: 0 0 8px; font-size: 16px; }
    .upload-panel p { margin: 0 0 13px; color: #7a889d; font-size: 12px; }
    .file-input { display: none; }
    .file-button { display: inline-flex; align-items: center; justify-content: center; min-height: 35px; padding: 8px 13px; border: 0; border-radius: 8px; color: #fff; background: #2f78f5; box-shadow: 0 3px 9px #3178f638; font-size: 12px; font-weight: 700; cursor: pointer; }
    .file-button:hover { background: #1968e9; }
    .import-actions { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .compare-button { color: #315c56; border: 1px solid #9ab8b2; background: #eef6f4; box-shadow: none; }
    .compare-button:hover { color: #fff; background: #527d75; }
    .status { min-height: 18px; margin-top: 9px; color: #6e7e97; font-size: 12px; }
    .status.error { color: #c64046; }
    progress { display: block; width: 280px; height: 5px; margin: 7px auto 0; accent-color: #3178f6; }
    .hidden { display: none !important; }
    .workspace { margin-top: 13px; }
    .report-controls { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; padding: 12px; border: 1px solid #dce8e5; border-radius: 12px; background: #f9fcfb; box-shadow: 0 3px 14px #23386408; }
    .report-controls label { display: grid; gap: 4px; color: #667d78; font-size: 10px; font-weight: 700; }
    .report-controls select { height: 34px; padding: 7px 8px; border: 1px solid #cededb; border-radius: 7px; color: #294c47; background: #fff; font-size: 12px; outline-color: #527d75; }
    #marketplace { width: 112px; }
    #rangeStart, #rangeEnd { width: 218px; }
    #currentReport, #compareReport { width: 238px; }
    .storage-status { align-self: center; margin-left: auto; color: #73827f; font-size: 11px; white-space: nowrap; }
    .report-actions { display: flex; align-items: center; gap: 7px; }
    .delete-button { height: 34px; padding: 0 11px; border: 1px solid #e2c8cb; border-radius: 7px; color: #9a4047; background: #fff7f7; font-size: 11px; font-weight: 700; cursor: pointer; }
    .delete-button:hover { color: #fff; background: #b34c55; }
    .toolbar { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; padding: 12px; border: 1px solid #e4eaf3; border-radius: 12px; background: #fff; box-shadow: 0 3px 14px #23386408; }
    .toolbar label { display: grid; gap: 4px; color: #7a879b; font-size: 10px; font-weight: 700; }
    .toolbar input, .toolbar select { height: 34px; padding: 7px 8px; border: 1px solid #dce4ef; border-radius: 7px; color: #263852; background: #fff; font-size: 12px; outline-color: #3178f6; }
    #keyword { width: 255px; }
    .numeric { width: 112px; }
    .toolbar-actions { margin-left: auto; display: flex; align-items: center; gap: 7px; }
    .replace-file { min-height: 34px; color: #315377; background: #edf3fb; box-shadow: none; }
    .replace-file:hover { color: #1f66cd; background: #e3edfb; }
    .reset-button { height: 34px; padding: 0 13px; border: 1px solid #d8e1eb; border-radius: 7px; color: #566a7b; background: #f7f9fc; font-size: 12px; font-weight: 700; cursor: pointer; }
    .reset-button:hover { color: #9a4047; border-color: #dfb9bd; background: #fff4f5; }
    .summary { min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 3px; color: #718097; font-size: 11px; }
    .summary strong { color: #344863; font-weight: 700; }
    .grid { overflow-x: auto; border: 1px solid #e1e8f2; border-radius: 12px; background: #fff; box-shadow: 0 4px 18px #23386408; }
    .grid-header, .data-row { min-width: 1620px; display: grid; grid-template-columns: 92px minmax(230px, 1fr) 108px 108px 180px 20px 92px minmax(230px, 1fr) 108px 108px 180px; align-items: center; }
    .workspace.compare-mode .grid-header, .workspace.compare-mode .data-row { min-width: 1680px; grid-template-columns: 88px 88px 100px minmax(180px, 1fr) 96px 96px 180px 20px 88px 88px 100px minmax(180px, 1fr) 96px 96px 180px; }
    .grid-header { height: 42px; color: #66778e; background: #f8fafd; border-bottom: 1px solid #e5ebf3; font-size: 12px; font-weight: 700; letter-spacing: .2px; }
    .grid-header > div, .data-row > div { padding: 0 10px; }
    .data-row { height: 42px; border-bottom: 1px solid #eef2f7; color: #34435d; font-size: 13px; background: #fff; }
    .data-row:hover { background: #f8fbff; }
    .data-row:last-child { border-bottom: 0; }
    .column-divider { align-self: stretch; padding: 0 !important; border-left: 1px solid #dfe7f1; background: #f8fafd; }
    .compare-column, .compare-filter { display: none !important; }
    .workspace.compare-mode .compare-column { display: block !important; }
    .workspace.compare-mode .compare-filter { display: grid !important; }
    .sortable { position: relative; padding-right: 31px !important; cursor: pointer; user-select: none; white-space: nowrap; transition: color .15s, background .15s; }
    .sortable:hover { color: #006d77; background: #eef6f4; }
    .sort-indicator { position: absolute; top: 50%; right: 8px; min-width: 20px; color: #006d77; font-size: 10px; text-align: right; transform: translateY(-50%); }
    .rank { color: #687995; font-variant-numeric: tabular-nums; }
    .term-cell { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .trends-link { width: 22px; height: 22px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 6px; background: #f0f4fa; }
    .trends-link:hover { background: #e3edfb; }
    .trends-link img { width: 16px; height: 16px; display: block; }
    .amazon-link { overflow: hidden; color: #006d77; font-weight: 650; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
    .amazon-link:hover { color: #004f57; text-decoration: underline; }
    .percent { color: #334862; font-variant-numeric: tabular-nums; }
    .trend-cell { height: 38px; min-width: 0; display: flex; align-items: center; }
    .trend-canvas { width: 168px; height: 34px; display: block; border-radius: 5px; cursor: crosshair; }
    .trend-canvas:hover { background: #f3f8f7; }
    .trend-placeholder { color: #9aa6b4; font-size: 10px; white-space: nowrap; }
    .trend-tooltip { position: fixed; z-index: 1001; max-width: 300px; padding: 7px 9px; pointer-events: none; border: 1px solid #cddbd8; border-radius: 7px; color: #24413d; background: #fff; box-shadow: 0 6px 20px #1d35312b; font-size: 11px; line-height: 1.45; }
    .trend-modal { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 24px; background: #17233b7d; }
    .trend-dialog { width: min(980px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; padding: 18px; border-radius: 14px; background: #fff; box-shadow: 0 18px 55px #10182742; }
    .trend-dialog-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .trend-dialog-header h2 { min-width: 0; margin: 0; overflow: hidden; color: #20324b; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .trend-dialog-header button { margin-left: auto; width: 32px; height: 32px; border: 1px solid #d9e1e9; border-radius: 7px; color: #607085; background: #f8fafc; cursor: pointer; }
    .trend-large-wrap { overflow-x: auto; border: 1px solid #e1e9ef; border-radius: 10px; background: #fbfcfe; }
    .trend-large { width: 920px; height: 330px; display: block; }
    .trend-legend { display: flex; gap: 14px; margin-top: 10px; color: #718097; font-size: 11px; }
    .trend-legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; background: var(--legend); }
    .change { font-weight: 700; font-variant-numeric: tabular-nums; }
    .change.positive { color: #18835b; }
    .change.negative { color: #c24b52; }
    .change.zero { color: #8794a5; }
    .empty { height: 140px; display: grid; place-items: center; color: #8a97a9; font-size: 12px; }
    .pagination { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 14px; margin-top: 14px; }
    .page-menu { grid-column: 2; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; }
    .page-button { min-width: 30px; height: 30px; padding: 0 7px; border: 1px solid #dce4ed; border-radius: 6px; color: #5c6c79; background: #fff; font-size: 11px; cursor: pointer; }
    .page-button:hover:not(:disabled) { color: #315c56; border-color: #91aaa5; background: #f3f8f7; }
    .page-button.active { color: #fff; border-color: #52746f; background: #52746f; font-weight: 700; }
    .page-button:disabled { color: #bcc5cf; cursor: default; }
    .ellipsis { min-width: 23px; color: #8b98a8; text-align: center; font-size: 11px; }
    .page-jump { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 6px; color: #718097; font-size: 11px; }
    .page-jump input { width: 72px; height: 30px; padding: 5px 7px; border: 1px solid #dce4ed; border-radius: 6px; color: #34435d; background: #fff; outline-color: #52746f; }
    .page-go { height: 30px; padding: 0 10px; border: 1px solid #91aaa5; border-radius: 6px; color: #315c56; background: #f3f8f7; font-size: 11px; cursor: pointer; }
    @media (max-width: 980px) {
      .shell { padding: 14px; }
      #keyword { width: 210px; }
      .pagination { display: flex; justify-content: center; flex-wrap: wrap; }
      .page-jump { margin-left: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="logo">ABA</div>
      <h1>热门搜索词分析器</h1>
      <span class="local-badge">本地持久化 · 1.5.0</span>
    </header>
    <input id="fileInput" class="file-input" type="file" accept=".csv,text/csv" />
    <input id="compareInput" class="file-input" type="file" accept=".csv,text/csv" multiple />
    <input id="batchInput" class="file-input" type="file" accept=".csv,text/csv" multiple />
    <section id="uploadPanel" class="upload-panel">
      <div>
        <h2>导入 ABA 热门搜索词 CSV</h2>
        <p>可批量导入多站点、多周次报告；数据仅保存在当前浏览器</p>
        <div class="import-actions"><label class="file-button" for="fileInput">导入一份</label><label class="file-button compare-button" for="compareInput">导入两份对比</label><label class="file-button compare-button" for="batchInput">批量导入</label></div>
        <div id="parseStatus" class="status"></div>
        <progress id="parseProgress" class="hidden" max="100" value="0"></progress>
      </div>
    </section>
    <section id="workspace" class="workspace hidden">
      <div class="report-controls">
        <label>站点<select id="marketplace"></select></label>
        <label>起始周<select id="rangeStart"></select></label>
        <label>结束周<select id="rangeEnd"></select></label>
        <label>查看周<select id="currentReport"></select></label>
        <label>对比周<select id="compareReport"><option value="">不对比</option></select></label>
        <span id="storageStatus" class="storage-status">正在读取本地报告…</span>
        <div class="report-actions"><label class="file-button replace-file compare-button" for="batchInput">继续导入</label><button id="deleteReport" class="delete-button" type="button">删除当前</button></div>
      </div>
      <div class="toolbar">
        <label>搜索词<input id="keyword" placeholder="筛选关键词" autocomplete="off" /></label>
        <label>排名 ≥<input id="rankMin" class="numeric" type="number" min="1" placeholder="不限" /></label>
        <label>排名 ≤<input id="rankMax" class="numeric" type="number" min="1" placeholder="不限" /></label>
        <label>TOP3点击 ≤ %<input id="clickMax" class="numeric" type="number" min="0" step="0.01" placeholder="不限" /></label>
        <label>TOP3转化 ≤ %<input id="conversionMax" class="numeric" type="number" min="0" step="0.01" placeholder="不限" /></label>
        <label class="compare-filter">涨跌 ≥<input id="changeMin" class="numeric" type="number" step="1" placeholder="不限" /></label>
        <label class="compare-filter">涨跌 ≤<input id="changeMax" class="numeric" type="number" step="1" placeholder="不限" /></label>
        <button id="resetFilters" class="reset-button" type="button">重置</button>
        <div class="toolbar-actions"><label class="file-button replace-file" for="fileInput">更换单份</label><label class="file-button replace-file compare-button" for="compareInput">更换对比</label></div>
      </div>
      <div class="summary"><span id="fileSummary"></span><span id="resultSummary"></span></div>
      <div class="grid" role="table" aria-label="ABA 热门搜索词">
        <div class="grid-header" role="row">
          <div class="sortable" data-sort="newRank" title="点击切换升序、降序或取消排序">排名 <span class="new-week-label"></span><span class="sort-indicator"></span></div><div class="compare-column sortable" data-sort="oldRank" title="点击切换升序、降序或取消排序">排名 <span class="old-week-label"></span><span class="sort-indicator"></span></div><div class="compare-column sortable" data-sort="change" title="旧排名减新排名；点击切换排序">涨跌幅度<span class="sort-indicator"></span></div><div>搜索词</div><div>TOP3点击</div><div>TOP3转化</div><div title="同站点所选周范围内的 ABA 搜索频率排名趋势">排名趋势</div>
          <div class="column-divider" aria-hidden="true"></div>
          <div class="sortable" data-sort="newRank" title="点击切换升序、降序或取消排序">排名 <span class="new-week-label"></span><span class="sort-indicator"></span></div><div class="compare-column sortable" data-sort="oldRank" title="点击切换升序、降序或取消排序">排名 <span class="old-week-label"></span><span class="sort-indicator"></span></div><div class="compare-column sortable" data-sort="change" title="旧排名减新排名；点击切换排序">涨跌幅度<span class="sort-indicator"></span></div><div>搜索词</div><div>TOP3点击</div><div>TOP3转化</div><div title="同站点所选周范围内的 ABA 搜索频率排名趋势">排名趋势</div>
        </div>
        <div id="dataRows"></div>
        <div id="empty" class="empty hidden">没有符合筛选条件的数据</div>
      </div>
      <nav id="pagination" class="pagination hidden" aria-label="数据分页">
        <div id="pageMenu" class="page-menu"></div>
        <div class="page-jump"><span>跳至</span><input id="pageInput" type="number" min="1" inputmode="numeric" aria-label="输入页码" /><button id="pageGo" class="page-go" type="button">跳转</button></div>
      </nav>
    </section>
  </main>
  <div id="trendTooltip" class="trend-tooltip hidden" role="tooltip"></div>
  <div id="trendModal" class="trend-modal hidden" role="dialog" aria-modal="true" aria-labelledby="trendModalTitle">
    <div class="trend-dialog">
      <div class="trend-dialog-header"><h2 id="trendModalTitle"></h2><button id="closeTrendModal" type="button" aria-label="关闭">×</button></div>
      <div class="trend-large-wrap"><canvas id="trendLarge" class="trend-large"></canvas></div>
      <div class="trend-legend"><span style="--legend:#16865d">排名提升</span><span style="--legend:#c24b52">排名下降</span><span style="--legend:#3178f6">当前查看周</span><span style="--legend:#b5c0cb">缺失周断开</span></div>
    </div>
  </div>
  <script>
    const ROWS_PER_PAGE = 100, RECORDS_PER_PAGE = ROWS_PER_PAGE * 2, PAGE_WINDOW = 21;
    const TREND_ICON = 'https://www.google.com/s2/favicons?domain=trends.google.com&sz=32';
    const MARKETPLACES = {
      US: { name: '美国', domain: 'www.amazon.com', geo: 'US' }, CA: { name: '加拿大', domain: 'www.amazon.ca', geo: 'CA' },
      MX: { name: '墨西哥', domain: 'www.amazon.com.mx', geo: 'MX' }, GB: { name: '英国', domain: 'www.amazon.co.uk', geo: 'GB' },
      DE: { name: '德国', domain: 'www.amazon.de', geo: 'DE' }, FR: { name: '法国', domain: 'www.amazon.fr', geo: 'FR' },
      IT: { name: '意大利', domain: 'www.amazon.it', geo: 'IT' }, ES: { name: '西班牙', domain: 'www.amazon.es', geo: 'ES' },
      JP: { name: '日本', domain: 'www.amazon.co.jp', geo: 'JP' }, AU: { name: '澳大利亚', domain: 'www.amazon.com.au', geo: 'AU' }
    };
    const ALIASES = { UK: 'GB', US: 'US', CA: 'CA', MX: 'MX', GB: 'GB', DE: 'DE', FR: 'FR', IT: 'IT', ES: 'ES', JP: 'JP', AU: 'AU' };
    const state = { records: [], filtered: [], fileName: '', mode: 'single', newPeriod: null, oldPeriod: null, sorts: [], page: 1, pageBeforeFilter: 1, filtering: false, filterTimer: 0 };
    const FILTER_IDS = ['keyword', 'rankMin', 'rankMax', 'clickMax', 'conversionMax', 'changeMin', 'changeMax'];
    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);
    const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    const numberOrNull = (value) => value.trim() === '' ? null : Number(value);
    const formatPercent = (value) => `${value.toLocaleString('zh-CN', { maximumFractionDigits: 2 })}%`;
    const marketplaceFromFilename = (fileName) => ALIASES[/^([A-Za-z]{2})[_-]/.exec(fileName.trim())?.[1]?.toUpperCase()] || null;
    const detectMarketplace = (fileName) => marketplaceFromFilename(fileName) || 'GB';
    const amazonUrl = (term) => `https://${MARKETPLACES[$('#marketplace').value].domain}/s?k=${encodeURIComponent(term)}`;
    const trendsUrl = (term) => `https://trends.google.com/trends/explore?geo=${MARKETPLACES[$('#marketplace').value].geo}&q=${encodeURIComponent(term)}`;
    $('#marketplace').innerHTML = Object.entries(MARKETPLACES).map(([code, item]) => `<option value="${code}">${code} · ${item.name}</option>`).join('');

    const DATABASE_NAME = 'amazon-aba-pwa';
    const DATABASE_VERSION = 1;
    const REPORT_DIRECTORY = 'aba-reports';
    let databasePromise = null;
    let catalog = [];
    let loadJob = null;
    let trendJob = null;
    let trendRangeKey = '';
    let openTrend = null;
    const trendCache = new Map();

    function openDatabase() {
      if (databasePromise) return databasePromise;
      databasePromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DATABASE_NAME, DATABASE_VERSION);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains('reports')) {
            const store = database.createObjectStore('reports', { keyPath: 'id' });
            store.createIndex('site', 'site', { unique: false });
            store.createIndex('endDate', 'endDate', { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      return databasePromise;
    }

    async function reportStore(mode, action) {
      const database = await openDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction('reports', mode);
        const request = action(transaction.objectStore('reports'));
        let result;
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => resolve(result);
        transaction.onerror = () => reject(transaction.error || request.error);
        transaction.onabort = () => reject(transaction.error || new Error('本地数据库事务已中止。'));
      });
    }

    const getStoredReports = () => reportStore('readonly', (store) => store.getAll());
    const putStoredReport = (report) => reportStore('readwrite', (store) => store.put(report));
    const deleteStoredReportMeta = (id) => reportStore('readwrite', (store) => store.delete(id));
    const formatBytes = (bytes) => {
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return `${(bytes / (1024 ** index)).toLocaleString('zh-CN', { maximumFractionDigits: index > 1 ? 2 : 0 })} ${units[index]}`;
    };

    async function requestPersistentStorage() {
      if (!navigator.storage?.persist) return false;
      try { return await navigator.storage.persist(); } catch { return false; }
    }

    async function updateStorageStatus() {
      if (!navigator.storage?.estimate) { $('#storageStatus').textContent = `${catalog.length} 份报告`; return; }
      try {

      $('#pagination').classList.remove('hidden');
      let start = Math.max(1, state.page - Math.floor(PAGE_WINDOW / 2));
      let end = Math.min(totalPages, start + PAGE_WINDOW - 1);
      start = Math.max(1, end - PAGE_WINDOW + 1);
      const menu = [`<button class="page-button" type="button" data-page="${Math.max(1, state.page - 1)}"${state.page === 1 ? ' disabled' : ''} aria-label="上一页">‹</button>`];
      menu.push(pageButton(1, state.page));
      if (start > 2) menu.push('<span class="ellipsis">…</span>');
      for (let page = Math.max(2, start); page <= Math.min(totalPages - 1, end); page++) menu.push(pageButton(page, state.page));
      if (end < totalPages - 1) menu.push('<span class="ellipsis">…</span>');
      if (totalPages > 1) menu.push(pageButton(totalPages, state.page));
      menu.push(`<button class="page-button" type="button" data-page="${Math.min(totalPages, state.page + 1)}"${state.page === totalPages ? ' disabled' : ''} aria-label="下一页">›</button>`);
      $('#pageMenu').innerHTML = menu.join('');
      $('#pageInput').max = String(totalPages);
      $('#pageInput').placeholder = `1-${totalPages}`;
    }

    function renderPage(scrollToTop = false) {
      const totalPages = Math.max(1, Math.ceil(state.filtered.length / RECORDS_PER_PAGE));
      state.page = Math.min(totalPages, Math.max(1, state.page));
      const start = (state.page - 1) * RECORDS_PER_PAGE;
      const left = state.filtered.slice(start, start + ROWS_PER_PAGE);
      const right = state.filtered.slice(start + ROWS_PER_PAGE, start + RECORDS_PER_PAGE);
      const rowCount = Math.max(left.length, right.length);
      $('#dataRows').innerHTML = Array.from({ length: rowCount }, (_, index) => `<div class="data-row" role="row">${recordCells(left[index])}<div class="column-divider" aria-hidden="true"></div>${recordCells(right[index])}</div>`).join('');
      $('#empty').classList.toggle('hidden', state.filtered.length > 0);
      $('#resultSummary').innerHTML = `<strong>${state.filtered.length.toLocaleString()}</strong> 条 · 第 <strong>${state.page.toLocaleString()}</strong> / ${totalPages.toLocaleString()} 页 · 每页左右各100条${state.mode === 'compare' ? ' · 涨跌=旧排名−新排名' : ''}`;
      renderPagination(totalPages);
      requestAnimationFrame(requestVisibleTrends);
      if (scrollToTop) $('.grid').scrollIntoView({ block: 'start' });
    }

    function goToPage(page) {
      const totalPages = Math.max(1, Math.ceil(state.filtered.length / RECORDS_PER_PAGE));
      if (!Number.isFinite(page)) return;
      state.page = Math.min(totalPages, Math.max(1, Math.trunc(page)));
      if (!state.filtering) state.pageBeforeFilter = state.page;
      $('#pageInput').value = '';
      renderPage(true);
    }

    function applyFilters() {
      const keyword = $('#keyword').value.trim().toLocaleLowerCase().replace(/\s+/g, ' ');
      const rankMin = numberOrNull($('#rankMin').value), rankMax = numberOrNull($('#rankMax').value);
      const clickMax = numberOrNull($('#clickMax').value), conversionMax = numberOrNull($('#conversionMax').value);
      const changeMin = state.mode === 'compare' ? numberOrNull($('#changeMin').value) : null;
      const changeMax = state.mode === 'compare' ? numberOrNull($('#changeMax').value) : null;
      const hasFilters = Boolean(keyword) || rankMin != null || rankMax != null || clickMax != null || conversionMax != null || changeMin != null || changeMax != null;
      if (hasFilters && !state.filtering) state.pageBeforeFilter = state.page;
      state.filtered = sortRows(state.records.filter((row) => (!keyword || row.searchKey.includes(keyword)) && (rankMin == null || row.newRank >= rankMin) && (rankMax == null || row.newRank <= rankMax) && (clickMax == null || row.top3Click <= clickMax) && (conversionMax == null || row.top3Conversion <= conversionMax) && (changeMin == null || row.change >= changeMin) && (changeMax == null || row.change <= changeMax)));
      state.page = hasFilters ? 1 : (state.filtering ? state.pageBeforeFilter : state.page);
      state.filtering = hasFilters;
      renderPage();
    }
    function scheduleFilter() { window.clearTimeout(state.filterTimer); state.filterTimer = window.setTimeout(applyFilters, 160); }

    let importJob = null;
    const createToken = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
    const reportTime = (report) => Date.parse(report.endDate) || 0;
    const newestFirst = (a, b) => reportTime(b) - reportTime(a) || b.weekNumber - a.weekNumber || String(b.importedAt).localeCompare(String(a.importedAt));
    const oldestFirst = (a, b) => -newestFirst(a, b);
    const reportLabel = (report) => `${report.label} · ${Number(report.rowCount || 0).toLocaleString()} 条`;

    function setImportStatus(message, error = false) {
      $('#parseStatus').textContent = message;
      $('#parseStatus').className = `status${error ? ' error' : ''}`;
    }

    function importError(message) {
      importJob = null;
      $('#parseProgress').classList.add('hidden');
      $('#uploadPanel').classList.remove('hidden');
      $('#workspace').classList.toggle('hidden', catalog.length === 0);
      setImportStatus(message, true);
      updateStorageStatus();
    }

    function siteForFile(file, fallback) {
      const detected = marketplaceFromFilename(file.name);
      if (detected) return detected;
      const answer = window.prompt(`无法从文件名识别站点：\n${file.name}\n\n请输入 US、CA、MX、GB、DE、FR、IT、ES、JP 或 AU：`, fallback || 'GB');
      return answer ? ALIASES[answer.trim().toUpperCase()] || null : null;
    }

    function startImport(files, mode) {
      const selected = Array.from(files || []);
      if ((mode === 'single' && selected.length !== 1) || (mode === 'compare' && selected.length !== 2) || (mode === 'batch' && selected.length < 1)) {
        importError(mode === 'compare' ? '请选择两份 CSV 报告文件。' : '请选择至少一份 CSV 报告文件。');
        return;
      }
      if (selected.some((file) => !file.name.toLowerCase().endsWith('.csv'))) { importError('请只选择 CSV 文件。'); return; }
      const fallback = catalog.length ? ($('#marketplace').value || 'GB') : 'GB';
      const entries = selected.map((file) => ({ file, site: siteForFile(file, fallback) }));
      if (entries.some((entry) => !entry.site)) { importError('导入已取消：有文件未指定有效站点。'); return; }
      if (mode === 'compare' && entries[0].site !== entries[1].site) { importError(`两份报告站点不同（${entries[0].site} / ${entries[1].site}），请重新选择相同站点的文件。`); return; }
      loadJob = null;
      if (trendJob) { trendJob = null; restartTrendWorker(); }
      requestPersistentStorage().then(updateStorageStatus);
      $('#uploadPanel').classList.remove('hidden');
      $('#workspace').classList.add('hidden');
      $('#parseProgress').value = 0;
      $('#parseProgress').classList.remove('hidden');
      setImportStatus('正在准备导入…');
      importJob = { token: createToken(), files: entries, mode, current: 0, imported: [], skipped: 0 };
      parseNextFile();
    }

    function parseNextFile() {
      if (!importJob) return;
      const entry = importJob.files[importJob.current];
      setImportStatus(`正在解析第 ${importJob.current + 1}/${importJob.files.length} 份：${entry.file.name}`);
      $('#parseProgress').value = 0;
      parser.postMessage({ action: 'parse', file: entry.file, site: entry.site, index: importJob.current, total: importJob.files.length, token: importJob.token });
    }

    async function acceptImportedReport(data) {
      const job = importJob;
      const entry = job.files[data.index];
      const meta = {
        id: `${entry.site}|${data.period.endDate}|${data.fileHash}`,
        site: entry.site,
        weekNumber: data.period.weekNumber,
        startDate: data.period.startDate,
        endDate: data.period.endDate,
        label: data.period.label,
        fileHash: data.fileHash,
        fileName: entry.file.name,
        storageFile: data.storageFile,
        trendFile: data.trendFile,
        trendVersion: 1,
        rowCount: data.rowCount,
        sourceSize: entry.file.size,
        importedAt: new Date().toISOString()
      };
      const duplicate = catalog.find((report) => report.id === meta.id);
      if (duplicate) {
        const updated = { ...duplicate, trendFile: meta.trendFile, trendVersion: 1 };
        await putStoredReport(updated);
        catalog = catalog.map((report) => report.id === updated.id ? updated : report);
        job.imported.push(updated);
        job.skipped++;
      } else {
        const sameWeek = catalog.filter((report) => report.site === meta.site && report.endDate === meta.endDate);
        if (sameWeek.length && !window.confirm(`${meta.site} 站 ${meta.label} 已有不同版本。\n\n点击“确定”替换旧版本，点击“取消”保留旧版本。`)) {
          await deleteStoredReportFile(meta.storageFile);
          await deleteStoredReportFile(meta.trendFile);
          job.skipped++;
        } else {
          await putStoredReport(meta);
          for (const oldReport of sameWeek) {
            await deleteStoredReportMeta(oldReport.id);
            await deleteStoredReportFile(oldReport.storageFile);
            await deleteStoredReportFile(oldReport.trendFile);
          }
          catalog = catalog.filter((report) => !sameWeek.some((oldReport) => oldReport.id === report.id));
          catalog.push(meta);
          job.imported.push(meta);
        }
      }
      job.current++;
      if (job.current < job.files.length) parseNextFile();
      else await finishImport(job);
    }

    async function finishImport(job) {
      if (importJob !== job) return;
      importJob = null;
      $('#parseProgress').classList.add('hidden');
      const imported = [...job.imported].sort(newestFirst);
      const suffix = job.skipped ? `，跳过 ${job.skipped} 份` : '';
      setImportStatus(`导入完成：${imported.length} 份可用报告${suffix}`);
      let primaryId = null, compareId = null;
      if (job.mode === 'single') primaryId = imported[0]?.id || null;
      if (job.mode === 'compare' && imported.length === 2) { primaryId = imported[0].id; compareId = imported[1].id; }
      if (job.mode !== 'compare') $('#compareReport').value = '';
      await refreshCatalog({ primaryId, compareId });
    }

    function fillSelect(select, reports, selectedValue, includeNone = false) {
      const options = includeNone ? ['<option value="">不对比</option>'] : [];
      options.push(...reports.map((report) => `<option value="${escapeHtml(report.id)}">${escapeHtml(reportLabel(report))}</option>`));
      select.innerHTML = options.join('');
      if (reports.some((report) => report.id === selectedValue)) select.value = selectedValue;
      else if (!includeNone && reports.length) select.value = reports[0].id;
      else select.value = '';
    }

    function rebuildReportSelectors(primaryId = null, compareId = null) {
      const site = $('#marketplace').value;
      const reports = catalog.filter((report) => report.site === site).sort(oldestFirst);
      const start = $('#rangeStart').value || reports[0]?.endDate;
      const end = $('#rangeEnd').value || reports.at(-1)?.endDate;
      const visible = reports.filter((report) => report.endDate >= start && report.endDate <= end).sort(newestFirst);
      fillSelect($('#currentReport'), visible, primaryId || $('#currentReport').value);
      const primary = catalog.find((report) => report.id === $('#currentReport').value);
      const older = primary ? visible.filter((report) => report.endDate < primary.endDate) : [];
      fillSelect($('#compareReport'), older, compareId || $('#compareReport').value, true);
    }

    function rebuildSiteView({ primaryId = null, compareId = null, site = null } = {}) {
      const primary = catalog.find((report) => report.id === primaryId);
      const desiredSite = primary?.site || site || $('#marketplace').value || catalog[0]?.site;
      const sites = Object.keys(MARKETPLACES).filter((code) => catalog.some((report) => report.site === code));
      $('#marketplace').innerHTML = sites.map((code) => `<option value="${code}">${code} · ${MARKETPLACES[code].name}</option>`).join('');
      $('#marketplace').value = sites.includes(desiredSite) ? desiredSite : sites[0];
      const reports = catalog.filter((report) => report.site === $('#marketplace').value).sort(oldestFirst);
      const rangeOptions = reports.map((report) => `<option value="${report.endDate}">${escapeHtml(report.label)}</option>`).join('');
      $('#rangeStart').innerHTML = rangeOptions;
      $('#rangeEnd').innerHTML = rangeOptions;
      $('#rangeStart').value = reports[0]?.endDate || '';
      $('#rangeEnd').value = reports.at(-1)?.endDate || '';
      rebuildReportSelectors(primaryId, compareId);
    }

    async function refreshCatalog(options = {}) {
      catalog = (await getStoredReports()).filter((report) => report?.id && report?.storageFile && MARKETPLACES[report.site]).sort(newestFirst);
      await updateStorageStatus();
      if (!catalog.length) {
        state.records = []; state.filtered = [];
        $('#uploadPanel').classList.remove('hidden');
        $('#workspace').classList.add('hidden');
        if (!$('#parseStatus').textContent) setImportStatus('报告仅保存在当前浏览器本地，可一次选择多份 CSV。');
        return;
      }
      const fallback = catalog[0];
      const siteFallback = options.site ? catalog.find((report) => report.site === options.site) : null;
      rebuildSiteView({ primaryId: options.primaryId || siteFallback?.id || fallback.id, compareId: options.compareId || null, site: options.site });
      await loadSelectedReports();
    }

    async function loadSelectedReports() {
      const primary = catalog.find((report) => report.id === $('#currentReport').value);
      const comparison = catalog.find((report) => report.id === $('#compareReport').value);
      if (!primary) return;
      if (trendJob) { trendJob = null; restartTrendWorker(); }
      loadJob = { token: createToken(), reports: comparison ? [primary, comparison] : [primary], results: [], current: 0 };
      state.records = []; state.filtered = []; state.page = 1; state.pageBeforeFilter = 1; state.filtering = false;
      $('#workspace').classList.remove('hidden');
      $('#workspace').setAttribute('aria-busy', 'true');
      $('#uploadPanel').classList.add('hidden');
      $('#dataRows').innerHTML = '';
      $('#empty').classList.remove('hidden');
      $('#empty').textContent = '正在从本地存储加载报告…';
      $('#pagination').classList.add('hidden');
      $('#fileSummary').innerHTML = `<strong>${escapeHtml(primary.label)}</strong> · 正在加载`;
      sendNextLoad();
    }

    function sendNextLoad() {
      if (!loadJob) return;
      const report = loadJob.reports[loadJob.current];
      $('#storageStatus').textContent = `正在加载 ${loadJob.current + 1}/${loadJob.reports.length}：${report.label}`;
      parser.postMessage({ action: 'load', storageFile: report.storageFile, token: loadJob.token, index: loadJob.current, total: loadJob.reports.length });
    }

    function finishLoad(job) {
      if (loadJob !== job) return;
      loadJob = null;
      const primary = job.reports[0], comparison = job.reports[1] || null;
      const primaryRows = job.results[0];
      if (comparison) {
        const oldRanks = new Map();
        for (const row of job.results[1]) if (!oldRanks.has(row.searchKey) || row.rank < oldRanks.get(row.searchKey)) oldRanks.set(row.searchKey, row.rank);
        state.mode = 'compare'; state.newPeriod = primary; state.oldPeriod = comparison;
        state.records = primaryRows.map((row) => { const oldRank = oldRanks.get(row.searchKey) || 0; return { ...row, newRank: row.rank, oldRank, change: oldRank - row.rank }; });
        $('#fileSummary').innerHTML = `<strong>${escapeHtml(primary.label)}</strong> 对比 ${escapeHtml(comparison.label)} · ${MARKETPLACES[primary.site].name}`;
      } else {
        state.mode = 'single'; state.newPeriod = primary; state.oldPeriod = null;
        state.records = primaryRows.map((row) => ({ ...row, newRank: row.rank, oldRank: 0, change: 0 }));
        $('#fileSummary').innerHTML = `<strong>${escapeHtml(primary.fileName)}</strong> · ${escapeHtml(primary.label)}`;
      }
      state.fileName = primary.fileName;
      state.filtered = state.records;
      $('#empty').textContent = '没有符合筛选条件的数据';
      $('#workspace').removeAttribute('aria-busy');
      updateReportHeader();
      updateStorageStatus();
      requestAnimationFrame(() => applyFilters());
    }

    async function deleteCurrentReport() {
      const report = catalog.find((item) => item.id === $('#currentReport').value);
      if (!report || !window.confirm(`确定删除当前浏览器中的报告？\n\n${report.site} · ${report.label}\n${report.fileName}`)) return;
      if (trendJob) { trendJob = null; restartTrendWorker(); }
      await deleteStoredReportMeta(report.id);
      await deleteStoredReportFile(report.storageFile);
      await deleteStoredReportFile(report.trendFile);
      await refreshCatalog({ site: report.site });
    }

    async function handleTrendMessage({ data }) {
      if (!trendJob || data.token !== trendJob.token) return;
      const job = trendJob;
      if (data.type === 'trend-migration') {
        $('#storageStatus').textContent = `首次建立趋势索引 ${data.reportIndex + 1}/${data.reportTotal}：${data.label}`;
        return;
      }
      if (data.type === 'trend-migration-progress' || data.type === 'trend-index-progress') {
        $('#storageStatus').textContent = `建立趋势索引 ${data.reportIndex + 1}/${data.reportTotal} · ${data.count.toLocaleString()} / ${data.totalRecords.toLocaleString()} 条`;
        return;
      }
      if (data.type === 'trend-progress') {
        $('#storageStatus').textContent = `排名趋势 ${data.reportIndex + 1}/${data.reportTotal}：${data.label}`;
        return;
      }
      if (data.type === 'trend-error') {
        trendJob = null;
        $$('.trend-cell').forEach((cell) => { if (!trendCache.has(trendKey(job.rangeKey, cell.dataset.trendKey))) cell.innerHTML = `<span class="trend-placeholder" title="${escapeHtml(data.message)}">趋势读取失败</span>`; });
        updateStorageStatus();
        return;
      }
      if (data.type !== 'trend-result') return;
      for (const created of data.created || []) {
        const report = catalog.find((item) => item.id === created.id);
        if (!report) continue;
        const updated = { ...report, trendFile: created.trendFile, trendVersion: 1 };
        await putStoredReport(updated);
        catalog = catalog.map((item) => item.id === updated.id ? updated : item);
      }
      const weeks = job.reports.map((report) => ({ id: report.id, weekNumber: report.weekNumber, startDate: report.startDate, endDate: report.endDate, label: report.label }));
      for (const [key, ranks] of Object.entries(data.ranks || {})) {
        trendCache.set(trendKey(job.rangeKey, key), { weeks, ranks, term: job.terms.get(key) || key });
        if (trendCache.size > 4000) trendCache.delete(trendCache.keys().next().value);
      }
      trendJob = null;
      paintVisibleTrends();
      updateStorageStatus();
    }

    parser.onmessage = async ({ data }) => {
      if (importJob && data.token === importJob.token) {
        if (data.type === 'progress') { setImportStatus(`正在解析第 ${data.index + 1}/${data.total} 份：${importJob.files[data.index].file.name} · ${data.count.toLocaleString()} 条`); $('#parseProgress').value = data.percent; return; }
        if (data.type === 'storage-progress') { setImportStatus(`正在压缩保存第 ${importJob.current + 1}/${importJob.files.length} 份 · ${data.count.toLocaleString()} / ${data.totalRecords.toLocaleString()} 条`); $('#parseProgress').value = Math.round((data.count / data.totalRecords) * 100); return; }
        if (data.type === 'index-progress') { setImportStatus(`正在建立第 ${importJob.current + 1}/${importJob.files.length} 份趋势索引 · ${data.count.toLocaleString()} / ${data.totalRecords.toLocaleString()} 条`); $('#parseProgress').value = Math.round((data.count / data.totalRecords) * 100); return; }
        if (data.type === 'error') { importError(`第 ${data.index + 1} 份文件处理失败：${data.message}`); return; }
        if (data.type === 'complete') { try { await acceptImportedReport(data); } catch (error) { importError(`保存报告失败：${error.message || error}`); } }
        return;
      }
      if (loadJob && data.token === loadJob.token) {
        if (data.type === 'load-progress') { $('#storageStatus').textContent = `正在加载 ${data.index + 1}/${data.total} · ${data.count.toLocaleString()} 条`; return; }
        if (data.type === 'error') { loadJob = null; $('#workspace').removeAttribute('aria-busy'); $('#empty').textContent = `加载失败：${data.message}`; $('#empty').classList.remove('hidden'); updateStorageStatus(); return; }
        if (data.type === 'loaded') {
          const job = loadJob;
          job.results[data.index] = data.records;
          job.current++;
          if (job.current < job.reports.length) sendNextLoad(); else finishLoad(job);
        }
      }
    };
    trendParser.onmessage = handleTrendMessage;

    $('#fileInput').addEventListener('change', (event) => { startImport(event.target.files, 'single'); event.target.value = ''; });
    $('#compareInput').addEventListener('change', (event) => { startImport(event.target.files, 'compare'); event.target.value = ''; });
    $('#batchInput').addEventListener('change', (event) => { startImport(event.target.files, 'batch'); event.target.value = ''; });
    FILTER_IDS.forEach((id) => $('#' + id).addEventListener('input', scheduleFilter));
    $('#resetFilters').addEventListener('click', () => { window.clearTimeout(state.filterTimer); FILTER_IDS.forEach((id) => { $('#' + id).value = ''; }); applyFilters(); });
    $('#marketplace').addEventListener('change', () => { rebuildSiteView({ site: $('#marketplace').value }); loadSelectedReports(); });
    $('#rangeStart').addEventListener('change', () => { if ($('#rangeStart').value > $('#rangeEnd').value) $('#rangeEnd').value = $('#rangeStart').value; rebuildReportSelectors(); loadSelectedReports(); });
    $('#rangeEnd').addEventListener('change', () => { if ($('#rangeEnd').value < $('#rangeStart').value) $('#rangeStart').value = $('#rangeEnd').value; rebuildReportSelectors(); loadSelectedReports(); });
    $('#currentReport').addEventListener('change', () => { rebuildReportSelectors($('#currentReport').value); loadSelectedReports(); });
    $('#compareReport').addEventListener('change', loadSelectedReports);
    $('#deleteReport').addEventListener('click', () => deleteCurrentReport().catch((error) => window.alert(`删除失败：${error.message || error}`)));
    $('.grid-header').addEventListener('click', (event) => { const header = event.target.closest('[data-sort]'); if (header) toggleSort(header.dataset.sort); });
    $('#pagination').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-page]');
      if (button && !button.disabled) goToPage(Number(button.dataset.page));
    });
    $('#pageGo').addEventListener('click', () => goToPage(Number($('#pageInput').value)));
    $('#pageInput').addEventListener('keydown', (event) => { if (event.key === 'Enter') goToPage(Number(event.currentTarget.value)); });
    $('#dataRows').addEventListener('mousemove', (event) => { const canvas = event.target.closest('canvas.trend-canvas'); if (canvas) showTrendTooltip(canvas, event.clientX, event.clientY); else $('#trendTooltip').classList.add('hidden'); });
    $('#dataRows').addEventListener('mouseleave', () => $('#trendTooltip').classList.add('hidden'));
    $('#dataRows').addEventListener('click', (event) => { const canvas = event.target.closest('canvas.trend-canvas'); if (canvas) openTrendModal(canvas); });
    $('#trendLarge').addEventListener('mousemove', (event) => showTrendTooltip(event.currentTarget, event.clientX, event.clientY));
    $('#trendLarge').addEventListener('mouseleave', () => $('#trendTooltip').classList.add('hidden'));
    $('#closeTrendModal').addEventListener('click', closeTrendModal);
    $('#trendModal').addEventListener('click', (event) => { if (event.target === event.currentTarget) closeTrendModal(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('#trendModal').classList.contains('hidden')) closeTrendModal(); });
    const uploadPanel = $('#uploadPanel');
    ['dragenter', 'dragover'].forEach((name) => uploadPanel.addEventListener(name, (event) => { event.preventDefault(); uploadPanel.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach((name) => uploadPanel.addEventListener(name, (event) => { event.preventDefault(); uploadPanel.classList.remove('dragging'); }));
    uploadPanel.addEventListener('drop', (event) => { const files = event.dataTransfer.files; startImport(files, files.length === 1 ? 'single' : 'batch'); });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
    refreshCatalog().catch((error) => importError(`无法读取本地报告库：${error.message || error}`));
  </script>
</body>
</html>
